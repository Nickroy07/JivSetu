name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tests use a temporary SQLite database and synthetic data; no secrets are needed.
      - run: python -m pytest -q

  frontend:
    name: Frontend typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Next generates global types (e.g. LayoutProps) that a fresh checkout does not have yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint app components lib
      - run: npx next build
        env:
          # Placeholder so the production build has an API address; it is not contacted during the build.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
